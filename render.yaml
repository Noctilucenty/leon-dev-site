# Blueprint for the assistant API (the static site stays as its own Render
# static site — this adds ONLY the backend service the chatbot talks to).
#
# Setup on Render:
#   New + -> Blueprint -> pick this repo -> apply
#   (or New + -> Web Service -> this repo -> settings below by hand)
# Then open the service -> Environment -> add OPENAI_API_KEY, RESEND_API_KEY,
# and LEAD_TO_EMAIL yourself. Secrets and recipients are never committed.
# The frontend expects the service URL in assist.js (API_BASE) — if Render
# gives you a different URL than https://leon-assist.onrender.com, change
# that one constant and push.

services:
  - type: web
    name: leon-assist
    runtime: node
    # Mirrors the live service. Keeping this at Starter prevents a later
    # Blueprint apply from silently reintroducing free-tier cold starts.
    plan: starter
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false        # paste the real key in the dashboard, never in git
      - key: RESEND_API_KEY
        sync: false        # HTTPS lead delivery; required on Render because SMTP egress is blocked
      - key: LEAD_TO_EMAIL
        sync: false        # off-host inbox that receives each lead
      - key: LEAD_FROM_EMAIL
        value: Leon Builds <hello@leonbuilds.org>  # Resend-verified sender used for owner and visitor mail
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_MAX_OUTPUT
        value: "700"
      - key: LEADS_KEY
        generateValue: true   # unlocks /api/leads and /api/traffic — copy it from the Environment tab
      - key: CAL_WEBHOOK_SECRET
        sync: false        # same random signing secret configured on the Cal webhook; never commit it
