name: Search production follow-through

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: search-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the deployed revision and history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the exact static fingerprint
        id: build
        run: |
          npm run build:static
          fingerprint="$(tr -d '\r\n' < dist/site-version.txt)"
          if [[ ! "$fingerprint" =~ ^[0-9a-f]{64}$ ]]; then
            echo "invalid generated site fingerprint" >&2
            exit 1
          fi
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment and check live crawl foundations
        run: >-
          python3 tools/check_live_search.py
          --expected-fingerprint "${{ steps.build.outputs.fingerprint }}"
          --wait-seconds 900
          --poll-seconds 10

      - name: Submit changed URLs to IndexNow
        run: >-
          python3 tools/indexnow.py
          --submit
          --before-ref "${{ github.event.before }}"
          --after-ref "${{ github.sha }}"
          --expected-fingerprint "${{ steps.build.outputs.fingerprint }}"
