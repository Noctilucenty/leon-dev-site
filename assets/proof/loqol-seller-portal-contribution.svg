<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title description">
  <title id="title">LOQOL seller portal — frontend contribution</title>
  <desc id="description">Implementation workflow diagram, not a production screenshot. A seller enters an answer, which is held as a local draft while editing, then handled by the backend read / write API. Save attempts occur after a pause, on blur, and on close. Local edits are kept separate during server refreshes. This is a contribution to an existing product and design, not a guarantee of durable storage.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 6 L 1 11" fill="none" stroke="#16776E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; }
      .ink { fill: #172E36; }
      .muted { fill: #53656A; }
      .teal { fill: #16776E; }
      .step { fill: #172E36; font-size: 38px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#F5F1E9"/>

  <text x="104" y="106" class="teal" font-size="24" font-weight="700" letter-spacing="3">IMPLEMENTATION / FRONTEND</text>
  <text x="104" y="214" class="ink" font-size="82" font-weight="700" letter-spacing="-2">LOQOL seller portal</text>
  <text x="104" y="272" class="muted" font-size="32">Frontend contribution • React + TypeScript</text>

  <line x1="104" y1="330" x2="1496" y2="330" stroke="#D8DDD7" stroke-width="2"/>
  <text x="104" y="390" class="muted" font-size="23" font-weight="700" letter-spacing="2">ANSWER SAVE FLOW</text>

  <rect x="104" y="432" width="400" height="278" rx="24" fill="#FBFAF6" stroke="#C8D5CF" stroke-width="2"/>
  <text x="136" y="489" class="teal" font-size="25" font-weight="700">01</text>
  <text x="136" y="564" class="step">
    <tspan x="136" dy="0">Seller enters</tspan>
    <tspan x="136" dy="51">an answer</tspan>
  </text>

  <path d="M 526 571 H 576" fill="none" stroke="#16776E" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="600" y="432" width="400" height="278" rx="24" fill="#EAF1EC" stroke="#AFC8BD" stroke-width="2"/>
  <text x="632" y="489" class="teal" font-size="25" font-weight="700">02</text>
  <text x="632" y="564" class="step">
    <tspan x="632" dy="0">Local draft</tspan>
    <tspan x="632" dy="51">while editing</tspan>
  </text>

  <path d="M 1022 571 H 1072" fill="none" stroke="#16776E" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="1096" y="432" width="400" height="278" rx="24" fill="#FBFAF6" stroke="#C8D5CF" stroke-width="2"/>
  <text x="1128" y="489" class="teal" font-size="25" font-weight="700">03</text>
  <text x="1128" y="564" class="step">
    <tspan x="1128" dy="0">Backend</tspan>
    <tspan x="1128" dy="51" font-size="36">read / write API</tspan>
  </text>

  <text x="104" y="815" class="ink" font-size="32">
    <tspan x="104" dy="0">Save attempts after a pause, on blur, and on close.</tspan>
    <tspan x="104" dy="49">Local edits are kept separate during server refreshes.</tspan>
  </text>

  <line x1="104" y1="986" x2="1496" y2="986" stroke="#D8DDD7" stroke-width="2"/>
  <text x="104" y="1042" class="muted" font-size="26">
    <tspan x="104" dy="0">Implementation diagram — not a production screenshot.</tspan>
    <tspan x="104" dy="40">Contribution to an existing product and design.</tspan>
  </text>
</svg>
